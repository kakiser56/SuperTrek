name: SuperTrek
options:
  bundleIdPrefix: com.kiserapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TrekEngine:
    path: ../TrekEngine
targets:
  SuperTrek:
    type: application
    platform: iOS
    sources:
      - SuperTrek
    dependencies:
      - package: TrekEngine
    info:
      path: SuperTrek/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiserapps.supertrek
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: Super Trek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QE3GSQ7TYQ
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
  SuperTrekUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SuperTrekUITests
    dependencies:
      - target: SuperTrek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiserapps.supertrek.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QE3GSQ7TYQ
schemes:
  SuperTrek:
    build:
      targets:
        SuperTrek: all
        SuperTrekUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SuperTrekUITests
